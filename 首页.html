<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请假申请</title>
    <link rel="stylesheet" href="./首页.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <a href="./登录.html" id="xia"><span class="back-icon">&lt;</span></a>
        <span class="close-icon">×</span>
        <h1 class="nav-title">请假</h1>
        
    </div>

    <!-- 请假规则 + 病假 同一行 -->
    <div class="head-row">
        <span class="rule-text">请假规则</span>
        <span class="leave-type-text">病假</span>
    </div>

    <!-- 主体表单区域 -->
    <div class="main-box">
        <!-- 请假内容 -->
        <div class="form-block">
            <h3 class="block-title">请假内容</h3>

            <div class="form-item">
                <label class="lab"><span class="star">*</span> 开始时间</label>
                <input type="datetime-local" id="startTime" class="form-ipt">
                <span class="arrow">></span>
            </div>

            <div class="form-item">
                <label class="lab"><span class="star">*</span> 结束时间</label>
                <input type="datetime-local" id="endTime" class="form-ipt">
                <span class="arrow">></span>
            </div>

            <div class="form-item">
                <label class="lab"><span class="star">*</span> 请假时长</label>
                <input type="text" id="timeLength" class="form-ipt" readonly placeholder="">
            </div>

            <div class="form-item text-item">
                <label class="lab"><span class="star">*</span> 请假原因</label>
                <textarea id="leaveReason" placeholder="请输入请假原因"></textarea>
                <div class="word-num">0/1000</div>
            </div>

            <div class="form-item upload-item">
                <label class="lab">证明材料</label>
                <div class="upload-wrap">
                    <label class="upload-btn">
                        <span class="plus">+</span>
                        <span class="up-txt">0/4</span>
                        <input type="file" id="fileUp" multiple accept="image/*" hidden>
                    </label>
                </div>
                <p class="up-tips">请上传证明材料</p>
            </div>

            <!-- 发起位置（修改后：可手写+下拉选择） -->
<div class="form-item pos-item">
    <label class="lab">发起位置</label>
    <div class="pos-info">
        <!-- 可输入+下拉选择的位置输入框 -->
        <input type="text" class="pos-text-input" id="posText" list="locationList" placeholder="请输入位置">
        <!-- 下拉选项列表（默认地址在这里） -->
        <datalist id="locationList">
            <option value="中国河北省石家庄市桥西区振头街道汇宁街"></option>
        </datalist>
        <span class="re-pos">自行输入</span>
    </div>
</div>

        <!-- 请假去向 -->
        <div class="form-block">
            <h3 class="block-title">请假去向</h3>
            <div class="form-item">
                <label class="lab"><span class="star">*</span>是否离校</label>
                <select id="leaveSchool" class="form-ipt">
                    <option value="">请选择</option>
                    <option value="1">是</option>
                    <option value="0">否</option>
                </select>
            </div>
        </div>

        <!-- 抄送人 -->
        <div class="form-block">
            <h3 class="block-title">抄送人</h3>
            <div class="add-people">+</div>
            <div class="cc-tip">
                <span>常用抄送人（可点击下方标签选中人员）</span>
                <span class="edit-btn">编辑</span>
            </div>
            <p class="empty-tip">暂无数据，请点击编辑进行设置</p>
        </div>

        <!-- 提交按钮 -->
        <div class="submit-box">
            <button class="submit-btn">提交</button>
        </div>
    </div>

    <script>
        // 1. 请假原因字数统计
const reason = document.getElementById('leaveReason')
const wordNum = document.querySelector('.word-num')
reason.addEventListener('input',function(){
    let len = this.value.length
    wordNum.innerText = `${len}/1000`
})

// 2. 选择时间自动计算请假时长
let start = document.getElementById('startTime')
let end = document.getElementById('endTime')
let lengthIpt = document.getElementById('timeLength')

function countTime(){
    if(!start.value || !end.value) return
    let sTime = new Date(start.value)
    let eTime = new Date(end.value)
    if(eTime <= sTime){
        alert('结束时间不能早于开始时间')
        end.value = ''
        lengthIpt.value = ''
        return
    }
    let diff = eTime - sTime
    let day = Math.floor(diff / (1000*60*60*24))
    let hour = Math.floor((diff % (1000*60*60*24)) / (1000*60*60))
    let min = Math.floor((diff % (1000*60*60)) / (1000*60))
    lengthIpt.value = `${day}天${hour}时${min}分`
}
start.addEventListener('change',countTime)
end.addEventListener('change',countTime)

// 3. 图片上传计数
let fileInp = document.getElementById('fileUp')
let upText = document.querySelector('.up-txt')
let fileArr = []
fileInp.addEventListener('change',function(){
    let files = Array.from(this.files)
    if(fileArr.length + files.length >4){
        alert('最多上传4张图片')
        return
    }
    fileArr = fileArr.concat(files)
    upText.innerText = `${fileArr.length}/4`
})

// 4. 表单提交 + 存数据 + 跳转到详情页（修复完整版）
document.querySelector('.submit-btn').addEventListener('click',function(){
    // 获取元素
    const startTime = document.getElementById('startTime');
    const endTime = document.getElementById('endTime');
    const timeLength = document.getElementById('timeLength');
    const leaveReason = document.getElementById('leaveReason');
    const leaveSchool = document.getElementById('leaveSchool');
    const posText = document.getElementById('posText');

    // 表单校验
    if(!startTime.value){ alert('请选择开始时间'); return; }
    if(!endTime.value){ alert('请选择结束时间'); return; }
    if(!leaveReason.value.trim()){ alert('请填写请假原因'); return; }
    if(!leaveSchool.value){ alert('请选择是否离校'); return; }

    // 打包所有数据
    const data = {
        startTime: startTime.value,
        endTime: endTime.value,
        timeLength: timeLength.value,
        reason: leaveReason.value,
        position: posText.value,
        isLeave: leaveSchool.value == 1 ? '是' : '否',
        submitTime: new Date().toISOString()
    }

    // 存入localStorage（核心）
    localStorage.setItem('leaveData', JSON.stringify(data));
    
    // 提交成功，跳转到详情页
    alert('提交成功！');
    location.href = '请假系统.html';
})
    </script>
</body>
</html>
